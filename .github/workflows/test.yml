name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rspec:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ['3.1', '3.4']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: latest
          bundler-cache: true
      - run: bundle exec rake

  export-smoke:
    strategy:
      fail-fast: false
      matrix:
        godot: ['4.2.2', '4.3.0', '4.4.1', '4.5.1', '4.6.0', '4.7.1']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler: latest
          bundler-cache: true
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot }}
          use-dotnet: false
          include-templates: true
      - name: Headless export of the fixture project
        run: bundle exec fastlane run godot_export preset:Web project_path:spec/fixtures/smoke_project
