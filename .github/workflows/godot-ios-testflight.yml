# Reusable workflow: Godot iOS build -> TestFlight.
#
# Call from your game repository:
#
#   jobs:
#     beta:
#       uses: Mad-Science-Software/fastlane-plugin-godot/.github/workflows/godot-ios-testflight.yml@main
#       with:
#         project-dir: .            # directory containing project.godot + Gemfile
#         godot-version: '4.7.1'
#         runs-on: '["self-hosted", "macOS"]'   # optional; default macos-latest
#       secrets:
#         ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
#         ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
#         ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}   # raw contents of the .p8
#
# See docs/CI.md for the signing strategy this assumes (fastlane match
# recommended for teams; MATCH_* secrets pass through when set).
name: godot-ios-testflight

on:
  workflow_call:
    inputs:
      project-dir:
        type: string
        default: '.'
      godot-version:
        type: string
        required: true
      lane:
        type: string
        default: 'ios beta'
      match-git-url:
        description: 'Override the Matchfile git_url (use the ssh form with a deploy key)'
        type: string
        default: ''
      runs-on:
        description: >-
          Runner for the build job: a GitHub-hosted label, or a JSON array of
          labels for a self-hosted Mac (macOS minutes cost ten times Linux
          ones), e.g. '["self-hosted", "macOS"]'
        type: string
        default: 'macos-latest'
    secrets:
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_KEY_CONTENT:
        required: true
      MATCH_PASSWORD:
        required: false
      MATCH_GIT_BASIC_AUTHORIZATION:
        required: false
      MATCH_GIT_PRIVATE_KEY:
        required: false

jobs:
  build-and-upload:
    # A JSON array input becomes a label list; a bare label passes through.
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: godot_set_version's git-derived build number uses
          # `git rev-list --count HEAD`, which reads 1 on a shallow clone —
          # TestFlight then rejects the upload as a reused build number.
          fetch-depth: 0
      # setup-ruby's prebuilt Rubies embed /Users/runner/hostedtoolcache and
      # assume GitHub's image; a self-hosted Mac uses the Ruby it has.
      - uses: ruby/setup-ruby@v1
        if: runner.environment == 'github-hosted'
        with:
          ruby-version: '3.4'
          bundler: latest
          working-directory: ${{ inputs.project-dir }}
          bundler-cache: true
      - name: Install gems with the runner's own Ruby
        if: runner.environment == 'self-hosted'
        run: bundle install
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ inputs.godot-version }}
          use-dotnet: false
          include-templates: true
      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect
          printf '%s' "$ASC_KEY_CONTENT" > ~/.appstoreconnect/ci_key.p8
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      - name: Run lane
        run: |
          if [ -n "$MATCH_GIT_URL_INPUT" ]; then export MATCH_GIT_URL="$MATCH_GIT_URL_INPUT"; fi
          bundle exec fastlane ${{ inputs.lane }}
        env:
          MATCH_GIT_URL_INPUT: ${{ inputs.match-git-url }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ~/.appstoreconnect/ci_key.p8
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
